

services:
  # The Python SQS Consumer (FastAPI + Background Thread)
  ai-service:
    build: 
      context: ./ai_service_aws
      dockerfile: Dockerfile
     
    container_name: ai_service_aws
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=ap-south-1
    restart: unless-stopped

  # The Java Spring Boot Backend
  api-service:
    build: 
      context: ./api_service_aws
      dockerfile: Dockerfile
  
    container_name: api_service_aws
    ports:
      - "8081:8080"
    environment:
      - AWS_REGION=ap-south-1
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - ai-service
    restart: unless-stopped
